[package]
name = "aurora-synapse"
version = "0.1.0"
description = "Aurora Synapse - Orquestador y Puente Universal Multiplataforma"
authors = ["biglexj"]
edition = "2021"

[lib]
name = "aurora_synapse_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
